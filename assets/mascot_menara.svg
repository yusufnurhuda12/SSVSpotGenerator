<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-label="Maskot Menara SSV Studio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Menara - maskot SSV Studio</title>
  <g stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- sparkles -->
    <g fill="none" stroke="#FF6F8A" stroke-width="5">
      <path d="M345 105 v26 M332 118 h26"/>
      <path d="M52 300 v22 M41 311 h22"/>
      <path d="M70 120 v16 M62 128 h16" stroke="#FFAE2B"/>
    </g>

    <!-- feet (behind body) -->
    <ellipse cx="152" cy="362" rx="32" ry="15" fill="#8DD3DB"/>
    <ellipse cx="248" cy="362" rx="32" ry="15" fill="#8DD3DB"/>

    <!-- right arm (behind body) -->
    <ellipse cx="322" cy="272" rx="17" ry="32" transform="rotate(-22 322 272)" fill="#FFAE2B"/>

    <!-- satellite-dish ears (behind body) -->
    <circle cx="96" cy="160" r="27" fill="#8DD3DB"/>
    <circle cx="96" cy="160" r="9" fill="#FFF1C9" stroke-width="4"/>
    <circle cx="304" cy="160" r="27" fill="#8DD3DB"/>
    <circle cx="304" cy="160" r="9" fill="#FFF1C9" stroke-width="4"/>

    <!-- antenna -->
    <path d="M200 140 V84" fill="none"/>
    <circle cx="200" cy="70" r="14" fill="#FFBCC4"/>
    <!-- signal arcs -->
    <g fill="none">
      <path d="M170 48 Q156 70 170 92"/>
      <path d="M230 48 Q244 70 230 92"/>
      <path d="M148 34 Q120 70 148 106"/>
      <path d="M252 34 Q280 70 252 106"/>
    </g>

    <!-- body hard shadow -->
    <ellipse cx="210" cy="266" rx="112" ry="104" fill="#1A1A1A" stroke="none"/>
    <!-- body -->
    <ellipse cx="200" cy="256" rx="112" ry="104" fill="#FFAE2B"/>

    <!-- belly -->
    <ellipse cx="200" cy="300" rx="62" ry="50" fill="#FFF1C9" stroke-width="4"/>
    <!-- tiny tower glyph on belly -->
    <g fill="none" stroke-width="4">
      <path d="M200 274 L183 328 M200 274 L217 328"/>
      <path d="M192 300 H208 M187 314 H213"/>
    </g>
    <circle cx="200" cy="270" r="5" fill="#FF6F8A" stroke-width="3"/>

    <!-- eyes -->
    <circle cx="160" cy="226" r="25" fill="#FFFFFF"/>
    <circle cx="240" cy="226" r="25" fill="#FFFFFF"/>
    <circle cx="167" cy="229" r="12" fill="#1A1A1A" stroke="none"/>
    <circle cx="233" cy="229" r="12" fill="#1A1A1A" stroke="none"/>
    <circle cx="171" cy="224" r="4.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="237" cy="224" r="4.5" fill="#FFFFFF" stroke="none"/>

    <!-- cheeks -->
    <ellipse cx="122" cy="262" rx="15" ry="9" fill="#FFBCC4" stroke="none"/>
    <ellipse cx="278" cy="262" rx="15" ry="9" fill="#FFBCC4" stroke="none"/>

    <!-- mouth -->
    <path d="M182 254 Q200 282 218 254 Z" fill="#1A1A1A" stroke-width="4"/>
    <ellipse cx="200" cy="268" rx="8" ry="5" fill="#FF8FA3" stroke="none"/>

    <!-- waving left arm (front) -->
    <ellipse cx="84" cy="228" rx="17" ry="33" transform="rotate(32 84 228)" fill="#FFAE2B"/>
  </g>
</svg>
